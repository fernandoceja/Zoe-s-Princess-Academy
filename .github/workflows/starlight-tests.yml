# Starlight Quest checks: syntax, picture/voice rules, cache stamp consistency. No secrets, no paid services.
name: Starlight Quest tests
on: pull_request
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for f in starlight-quest/js/*.js starlight-quest/sw.js; do
            node --experimental-default-type=module --check "$f"
          done
      - name: Picture check
        run: node starlight-quest/tests/pic_check.mjs
      - name: Voice check
        run: node starlight-quest/tests/voice_check.mjs
      - name: Sound clip check
        run: node starlight-quest/tests/sound_check.mjs
      - name: Precache and stamp check
        run: node starlight-quest/tests/precache_check.mjs
      - name: Measurement round check
        run: node starlight-quest/tests/measure_check.mjs
      - name: Teacher word list check
        run: node starlight-quest/tests/words_check.mjs
      - name: Star milestone check
        run: node starlight-quest/tests/milestone_check.mjs
      - name: Today's star check
        run: node starlight-quest/tests/todaystar_check.mjs
