<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zoe's Starlight Quest</title>
<meta name="theme-color" content="#1a1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starlight">
<link vite-ignore rel="manifest" href="./manifest.webmanifest">
<link vite-ignore rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link vite-ignore rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link vite-ignore href="./vendor/fonts/nunito.css?v=20261028r3" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/main.tsx"></script>
<script>
  // Offline play: cache the game after the first visit, and ask the browser
  // to keep saved progress (localStorage) from being cleared under storage pressure.
  // Production build only (Vite fills %PROD%): the dev server must not install the worker.
  if ('%PROD%' === 'true' && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
        // Check for a newer game version on open and whenever she comes back to it.
        const check = () => { if (navigator.onLine !== false) reg.update().catch(() => {}); };
        check();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      }).catch((e) => console.warn('SW register failed', e));
    });
  }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
</script>
</body>
</html>
