<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Zoe's Starlight Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1033; font-family: 'Nunito', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; z-index: 100;
    background: linear-gradient(135deg, #fdfcfe 0%, #f4faeb 50%, #e6f7ff 100%);
    color: #5b4a8a; font-weight: 800; font-size: 22px; text-align: center; padding: 24px;
    transition: opacity .5s ease;
  }
  #loading .stars { font-size: 54px; animation: twinkle 1.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.15); opacity: 1; } }
  #load-error { display: none; max-width: 420px; font-size: 16px; font-weight: 600; color: #a33; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="game"></div>
<div id="loading">
  <div class="stars">✨👑✨</div>
  <div>Loading Starlight Quest…</div>
  <div id="load-error"></div>
</div>
<script type="module">
  const errBox = document.getElementById('load-error');
  try {
    const { main } = await import('./js/main.js');
    await main(document.getElementById('game'));
    const l = document.getElementById('loading');
    l.style.opacity = '0';
    setTimeout(() => l.remove(), 550);
  } catch (e) {
    console.error(e);
    errBox.style.display = 'block';
    errBox.textContent = 'Oh no! The quest could not start. ' +
      'Please check your internet connection (the 3D magic needs it once) and reload. ' +
      'Grown-ups: open the browser console for details.';
  }
</script>
</body>
</html>
