<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zoe's Starlight Quest</title>
<meta name="theme-color" content="#1a1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starlight">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link href="./vendor/fonts/nunito.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1033; font-family: 'Nunito', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; z-index: 100;
    background: linear-gradient(135deg, #fdfcfe 0%, #f4faeb 50%, #e6f7ff 100%);
    color: #5b4a8a; font-weight: 800; font-size: 22px; text-align: center; padding: 24px;
    transition: opacity .5s ease;
  }
  #loading .stars { font-size: 54px; animation: twinkle 1.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.15); opacity: 1; } }
  #load-error { display: none; max-width: 420px; font-size: 16px; font-weight: 600; color: #a33; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<div id="game"></div>
<div id="loading">
  <div class="stars">✨👑✨</div>
  <div>Loading Starlight Quest…</div>
  <div id="load-error"></div>
</div>
<script type="module">
  const errBox = document.getElementById('load-error');
  try {
    const { main } = await import('./js/main.js?v=20261023s2');
    await main(document.getElementById('game'));
    const l = document.getElementById('loading');
    l.style.opacity = '0';
    setTimeout(() => l.remove(), 550);
  } catch (e) {
    console.error(e);
    errBox.style.display = 'block';
    errBox.textContent = 'Oh no! The quest could not start. ' +
      'Please check your internet connection and reload. ' +
      'Grown-ups: open the browser console for details.';
  }
</script>
<script>
  // Offline play: cache the game after the first visit, and ask the browser
  // to keep saved progress (localStorage) from being cleared under storage pressure.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
        // Check for a newer game version on open and whenever she comes back to it.
        const check = () => { if (navigator.onLine !== false) reg.update().catch(() => {}); };
        check();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      }).catch((e) => console.warn('SW register failed', e));
    });
  }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
</script>
</body>
</html>
